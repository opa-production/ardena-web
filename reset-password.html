<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Reset your ardena account password.">
    <meta name="robots" content="noindex, nofollow">
    <!-- deploy: 2026-03-09 -->
    <title>Reset password - ardena</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=27">
    <link rel="canonical" href="https://ardena.co.ke/reset-password">

<body>
    <main class="reset-password-page">
        <section class="reset-password-section">
            <div class="reset-password-container">
                <div class="reset-password-card">
                    <h1 class="reset-password-title">Reset password</h1>
                    <p class="reset-password-subtitle">Enter your new password below. Use at least 8 characters.</p>
                    <form class="reset-password-form" id="resetPasswordForm" action="#" method="post" novalidate>
                        <div class="form-group">
                            <label for="reset-new-password">New password</label>
                            <div class="reset-password-input-wrap">
                                <input type="password" id="reset-new-password" name="new_password" required minlength="8" placeholder="Enter new password" autocomplete="new-password">
                                <button type="button" class="reset-password-toggle" id="toggle-new-password" aria-label="Show password" title="Show password">
                                    <svg class="reset-password-eye reset-password-eye--show" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                                    <svg class="reset-password-eye reset-password-eye--hide" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                                </button>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="reset-confirm-password">Confirm password</label>
                            <div class="reset-password-input-wrap">
                                <input type="password" id="reset-confirm-password" name="confirm_password" required minlength="8" placeholder="Confirm new password" autocomplete="new-password">
                                <button type="button" class="reset-password-toggle" id="toggle-confirm-password" aria-label="Show password" title="Show password">
                                    <svg class="reset-password-eye reset-password-eye--show" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                                    <svg class="reset-password-eye reset-password-eye--hide" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                                </button>
                            </div>
                        </div>
                        <div id="reset-form-message" class="reset-form-message" role="alert" aria-live="polite" hidden></div>
                        <div id="reset-back-to-app-wrap" class="reset-back-to-app-wrap" hidden>
                            <a href="oparides://" class="btn btn-primary reset-password-btn">Go back to app</a>
                        </div>
                        <button type="submit" class="btn btn-primary reset-password-btn" id="resetSubmitBtn">Set new password</button>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <script>
        (function() {
            // Client app password reset endpoint + deep link
            var API_URL = 'https://api.ardena.co.ke/api/v1/client/auth/reset-password';
            var SUCCESS_REDIRECT = 'oparides://';

            var form = document.getElementById('resetPasswordForm');
            var newP = document.getElementById('reset-new-password');
            var confirmP = document.getElementById('reset-confirm-password');
            var msgEl = document.getElementById('reset-form-message');
            var submitBtn = form ? form.querySelector('button[type="submit"]') : null;

            function getTokenFromUrl() {
                var params = new URLSearchParams(window.location.search);
                return params.get('token') || '';
            }

            function showMessage(text, isError) {
                if (!msgEl) return;
                msgEl.textContent = text;
                msgEl.hidden = false;
                msgEl.className = 'reset-form-message ' + (isError ? 'reset-form-message--error' : 'reset-form-message--success');
            }

            function setLoading(loading) {
                if (submitBtn) {
                    submitBtn.disabled = loading;
                    submitBtn.textContent = loading ? 'Resetting…' : 'Set new password';
                }
            }

            function showBackToAppButton() {
                var wrap = document.getElementById('reset-back-to-app-wrap');
                if (wrap) {
                    wrap.hidden = false;
                }
                if (submitBtn) {
                    submitBtn.style.display = 'none';
                }
            }

            function initPasswordToggles() {
                var toggleNew = document.getElementById('toggle-new-password');
                var toggleConfirm = document.getElementById('toggle-confirm-password');
                if (toggleNew && newP) {
                    toggleNew.addEventListener('click', function() {
                        var isPass = newP.type === 'password';
                        newP.type = isPass ? 'text' : 'password';
                        toggleNew.setAttribute('aria-label', isPass ? 'Hide password' : 'Show password');
                        toggleNew.setAttribute('title', isPass ? 'Hide password' : 'Show password');
                        toggleNew.querySelector('.reset-password-eye--show').hidden = isPass;
                        toggleNew.querySelector('.reset-password-eye--hide').hidden = !isPass;
                    });
                }
                if (toggleConfirm && confirmP) {
                    toggleConfirm.addEventListener('click', function() {
                        var isPass = confirmP.type === 'password';
                        confirmP.type = isPass ? 'text' : 'password';
                        toggleConfirm.setAttribute('aria-label', isPass ? 'Hide password' : 'Show password');
                        toggleConfirm.setAttribute('title', isPass ? 'Hide password' : 'Show password');
                        toggleConfirm.querySelector('.reset-password-eye--show').hidden = isPass;
                        toggleConfirm.querySelector('.reset-password-eye--hide').hidden = !isPass;
                    });
                }
            }

            if (form) {
                initPasswordToggles();
                var token = getTokenFromUrl();
                if (!token) {
                    showMessage('Invalid or missing reset link. Please use the link from your email.', true);
                }

                form.addEventListener('submit', function(e) {
                    e.preventDefault();

                    if (!token) {
                        showMessage('Invalid or missing reset link. Please use the link from your email.', true);
                        return;
                    }
                    if (newP.value.length < 8) {
                        showMessage('Password must be at least 8 characters.', true);
                        return;
                    }
                    if (newP.value !== confirmP.value) {
                        showMessage('Passwords do not match.', true);
                        return;
                    }

                    msgEl.hidden = true;
                    msgEl.textContent = '';
                    setLoading(true);

                    fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            token: token,
                            new_password: newP.value,
                            new_password_confirmation: confirmP.value
                        })
                    })
                    .then(function(res) {
                        return res.json().then(function(data) {
                            return { ok: res.ok, status: res.status, data: data };
                        }).catch(function() {
                            return { ok: res.ok, status: res.status, data: {} };
                        });
                    })
                    .then(function(result) {
                        setLoading(false);
                        if (result.ok) {
                            showMessage(result.data && result.data.message ? result.data.message : 'Password reset successfully.', false);
                            window.location.href = SUCCESS_REDIRECT;
                            setTimeout(function() {
                                showBackToAppButton();
                            }, 1500);
                        } else {
                            var errMsg = (result.data && result.data.message) || (result.data && result.data.errors && JSON.stringify(result.data.errors)) || 'Something went wrong. Please try again.';
                            showMessage(errMsg, true);
                        }
                    })
                    .catch(function() {
                        setLoading(false);
                        showMessage('Network error. Please check your connection and try again.', true);
                    });
                });
            }
        })();
    </script>
