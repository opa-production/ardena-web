      *, *::before, *::after { box-sizing: border-box; }

        margin: 0;

        place-items: center;

        <p id="msg">The link may be out of date, or the address may have a typo in it.</p>
        <a href="/">Go to the homepage</a>
    </main>
    <script>
      (function () {
        var path = window.location.pathname;
        if (!path || path === "/" || path === "/404" || path === "/404.html") return;
        var msg = document.getElementById("msg");
        var strong = document.createElement("strong");
        try { path = decodeURIComponent(path); } catch (e) {}
        strong.textContent = path;
        msg.textContent = "Nothing lives at ";
        msg.appendChild(strong);
        msg.appendChild(document.createTextNode(". The link may be out of date, or the address may have a typo in it."));
      })();
    </script>
